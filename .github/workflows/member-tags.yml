name: 群友标签与资料
on: [pull_request]
permissions:
  contents: read
jobs:
  check-member-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-member-tags.mjs
      - run: node scripts/check-member-profiles.mjs
